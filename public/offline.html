<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04070d" />
    <title>Offline · LifeOS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #04070d;
        color: #e6edf7;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 380px;
        width: 100%;
        border: 1px solid #1b2a44;
        border-radius: 12px;
        background: #0b1322;
        padding: 24px;
      }
      .label { font: 11px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #fbbf24; }
      h1 { font-size: 20px; margin: 10px 0 8px; }
      p { color: #93a4c0; margin: 0 0 12px; }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 10px 16px;
        border-radius: 6px;
        border: 1px solid rgba(34, 211, 238, 0.6);
        color: #67e8f9;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Connection lost</p>
      <h1>LifeOS is offline</h1>
      <p>LifeOS needs an internet connection to load and save your data. Nothing is stored on this device while offline.</p>
      <p>Check your connection, then try again.</p>
      <a href="/calendar">Try again</a>
    </main>
  </body>
</html>
