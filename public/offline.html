<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · LifeOS</title>
    <script>
      // Same preference as the app (Settings → Appearance); falls back to the OS setting.
      (function () {
        try {
          var p = localStorage.getItem("lifeos-theme");
          if (p === "light" || p === "dark") document.documentElement.setAttribute("data-theme", p);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f6f6f4;
        --surface: #ffffff;
        --border: #e6e5e1;
        --fg: #1c1b18;
        --fg-muted: #5c5b56;
        --warning: #9a5a00;
        --accent: #5b5bd6;
        --accent-hover: #4f4fc8;
        --focus: #5b5bd6;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --canvas: #121214;
          --surface: #19191c;
          --border: #2a2a2f;
          --fg: #ededef;
          --fg-muted: #a3a3ab;
          --warning: #f2b84b;
          --accent-hover: #6767dc;
          --focus: #8b8cf6;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #121214;
        --surface: #19191c;
        --border: #2a2a2f;
        --fg: #ededef;
        --fg-muted: #a3a3ab;
        --warning: #f2b84b;
        --accent-hover: #6767dc;
        --focus: #8b8cf6;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--fg);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 380px;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        padding: 24px;
      }
      .label { font-size: 13px; font-weight: 500; color: var(--warning); margin: 0; }
      h1 { font-size: 20px; letter-spacing: -0.01em; margin: 6px 0 8px; }
      p { color: var(--fg-muted); margin: 0 0 12px; }
      a {
        display: inline-block;
        margin-top: 8px;
        padding: 9px 16px;
        border-radius: 8px;
        background: var(--accent);
        color: #ffffff;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover { background: var(--accent-hover); }
      a:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Connection lost</p>
      <h1>LifeOS is offline</h1>
      <p>LifeOS needs an internet connection to load and save your data. Nothing is stored on this device while offline.</p>
      <p>Check your connection, then try again.</p>
      <a href="/calendar">Try again</a>
    </main>
  </body>
</html>
